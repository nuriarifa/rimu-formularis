<body>
<header class="cap">
  <div class="idiomes" id="idiomes"><button type="button" data-l="ca">CA</button><button type="button" data-l="es">ES</button></div>
  <img class="logo" alt="">
  <div class="lema" id="lema"></div>
  <div class="menu amagat" id="menu"><button type="button" id="bSortir"></button></div>
</header>

<main class="contingut">
  <div id="bandaProva" class="avis amagat" style="margin-bottom:14px"></div>

  <!-- ENTRADA -->
  <section id="vLogin" class="amagat">
    <form class="targeta" id="fLogin" autocomplete="on">
      <h2 id="tLoginTitol"></h2>
      <div class="camp"><label for="lEmail" id="tCorreu"></label><input id="lEmail" type="email" autocomplete="username" required></div>
      <div class="camp"><label for="lPass" id="tPass"></label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <button class="boto ample" type="submit" id="tEntra"></button>
      <div class="error" id="lErr"></div>
      <div class="ok amagat" id="lOk"></div>
      <p class="ajuda"><a href="#" id="lnkCrear" style="color:var(--blau)"></a></p>
      <p class="ajuda" id="tLoginAjuda"></p>
    </form>
  </section>

  <section id="vNoPermis" class="amagat">
    <div class="targeta centre">
      <p id="tNoPermis"></p>
      <button class="boto sec" type="button" onclick="sortir()" id="tSortir2"></button>
    </div>
  </section>

  <!-- APP -->
  <section id="vApp" class="amagat">
    <nav class="pestanyes grans" id="navPrincipal"></nav>
    <div id="pantalla"></div>
  </section>
</main>
