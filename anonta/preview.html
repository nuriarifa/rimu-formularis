<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Previsualització · Anonta</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="icona-anonta.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icona-anonta.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viatges">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="../estil.css">
<link rel="stylesheet" href="anonta.css">
<script src="../config.js"></script>
<script src="../logo.js"></script>
<script src="comu.js"></script>
<script src="serveis.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Previsualització: el panell obre aquesta pàgina amb ?v=<viatge> i l'agència veu el viatge tal com el veurà el client,
// amb la seva pròpia sessió del panell (sense haver de crear cap client de prova).
(function(){
  const ID = new URLSearchParams(location.search).get("v") || "";
  const orig = supabase.createClient;
  const url = RIMU.SUPABASE_URL;
  const c = orig(url, RIMU.SUPABASE_KEY, { auth: { storageKey: "sb-" + new URL(url).hostname.split(".")[0] + "-auth-token" } });
  const NINGU = "00000000-0000-0000-0000-000000000000";
  const P = window.PREVIEW = { id: ID, viatge: null, client: c };
  const from = c.from.bind(c), rpc = c.rpc.bind(c);
  c.from = t => {
    const q = from(t), sel = q.select.bind(q);
    if(t === "an_viatges") q.select = (...a) => sel(...a).eq("id", ID || NINGU);
    if(t === "an_documents") q.select = (...a) => sel(...a).eq("visible", true);
    if(t === "an_pagaments") q.select = (...a) => P.viatge && P.viatge.mostrar_pagaments ? sel(...a) : sel(...a).eq("viatge_id", NINGU);
    return q;
  };
  // es mostra com el veu un titular del viatge
  c.rpc = (nom, args) => nom === "an_veu_pagaments" ? Promise.resolve({ data: !!(P.viatge && P.viatge.mostrar_pagaments), error: null }) : rpc(nom, args);
  supabase.createClient = () => c;
  // dins del marc de mòbil el que fa scroll és el body: quan l'app torna a dalt, també hi torna el body
  const sc = window.scrollTo.bind(window);
  window.scrollTo = (...a) => { sc(...a); const y = typeof a[0] === "object" ? a[0].top : a[1]; if(y === 0 && document.body) document.body.scrollTop = 0; };
})();
</script>
<style>
  body{padding-bottom:env(safe-area-inset-bottom)}
  .cap{padding-top:calc(14px + env(safe-area-inset-top))}
  .cap .menu{top:calc(12px + env(safe-area-inset-top))}
  .cap .idiomes{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:4px}
  .cap .idiomes button{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--linia);background:#fff;border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--gris)}
  .cap .idiomes button.actiu{background:var(--blau);border-color:var(--blau);color:#fff}
  .targeta-viatge{padding:0;overflow:hidden;cursor:pointer}
  .targeta-viatge .img{height:150px;background:var(--blau-clar) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:44px}
  .targeta-viatge .cos{padding:14px 16px}
  #bCompte, #instal{display:none !important}
  .banda-prev{background:#22313F;color:#fff;font-size:13.5px;padding:10px 14px;text-align:center;line-height:1.4}
  .banda-prev b{color:#FFD58A}
  .banda-prev .no-pub{display:block;margin-top:4px;color:#FFD58A}
  @media (min-width:700px){
    html{background:#E9EDF2;height:100%;overflow:hidden}
    /* el «mòbil» té l'alçada de la finestra i el contingut fa scroll a dins */
    body{max-width:420px;margin:24px auto;border:10px solid #22313F;border-radius:32px;height:calc(100vh - 48px);box-sizing:border-box;
      overflow-y:auto;overscroll-behavior:contain;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  }
</style>
</head>
<body>
<header class="cap">
  <div class="idiomes" id="idiomes"><button type="button" data-l="ca">CA</button><button type="button" data-l="es">ES</button></div>
  <img class="logo" alt="">
  <div class="lema" id="lema"></div>
  <div class="menu amagat" id="menu"><button type="button" id="bCompte" aria-label="Compte">👤</button></div>
</header>
<main class="contingut" id="main"><p class="meta centre">…</p></main>
<script>
(async function(){
  const P = window.PREVIEW, c = P.client, es = (localStorage.getItem("anonta-idioma-panell") || "").startsWith("es");
  const T = es
    ? { titol: "👁️ <b>Previsualización</b> · Así lo verá tu cliente en su móvil", nopub: "⚠️ Este viaje todavía no está publicado: el cliente aún no lo ve.",
        login: "Para previsualizar, entra primero en el panel de la agencia con este mismo navegador.", noTrobat: "No se ha encontrado el viaje." }
    : { titol: "👁️ <b>Previsualització</b> · Així ho veurà el teu client al mòbil", nopub: "⚠️ Aquest viatge encara no està publicat: el client encara no el veu.",
        login: "Per previsualitzar, entra primer al panell de l'agència amb aquest mateix navegador.", noTrobat: "No s'ha trobat el viatge." };
  const banda = document.createElement("div");
  banda.className = "banda-prev"; banda.innerHTML = T.titol;
  document.body.prepend(banda);
  const atura = msg => { document.getElementById("main").innerHTML = `<div class="targeta centre">${msg}</div>`; };
  const { data: { session } } = await c.auth.getSession();
  if(!session) return atura(T.login);
  const { data: v } = await c.from("an_viatges").select("id, titol, publicat, mostrar_pagaments");
  P.viatge = (v || [])[0] || null;
  if(!P.viatge) return atura(T.noTrobat);
  if(!P.viatge.publicat) banda.insertAdjacentHTML("beforeend", `<span class="no-pub">${T.nopub}</span>`);
  // idioma del titular del viatge (si no s'ha triat a mà)
  try{
    const { data: vc } = await c.from("an_viatge_clients").select("titular, an_clients(idioma)").eq("viatge_id", P.id);
    const tit = (vc || []).find(x => x.titular) || (vc || [])[0];
    if(tit?.an_clients?.idioma && !sessionStorage.getItem("anonta-prev-idioma")){
      localStorage.setItem("anonta-idioma", tit.an_clients.idioma);
      sessionStorage.setItem("anonta-prev-idioma", "1");
    }
  }catch{}
  if(!location.hash) history.replaceState(null, "", "#viatge/" + P.id);
  for(const f of ["app.js", "app-serveis.js"]){
    await new Promise((ok, ko) => { const s = document.createElement("script"); s.src = f; s.onload = ok; s.onerror = ko; document.body.appendChild(s); });
  }
})();
</script>
</body>
</html>
