<meta property="og:type" content="website">
<meta property="og:title" content="Anonta · Apps para agencias de viajes">
<meta property="og:description" content="App de viaje para tus clientes, itinerarios con IA y formulario de datos de viajeros. Pruébalo 30 días gratis.">

<link rel="icon" href="anonta/icona-anonta.svg" type="image/svg+xml">
<script src="config.js"></script>
<style>
  :root{--blau:#1F3A5F;--blau-mig:#3D698E;--blau-clar:#E8EEF6;--coral:#F2A65A;--coral-clar:#FDF1E4;--rosa:#E79893;--text:#22313F;--gris:#5F6F80;--linia:#DDE5EC;--fons:#F7F9FC}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:#fff;line-height:1.5;font-size:16px}
  a{color:inherit}
  .amp{max-width:1120px;margin:0 auto;padding:0 20px}
  /* Capçalera */
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--linia)}
  header .amp{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
  header .marca img{height:38px;display:block}
  header nav{display:flex;align-items:center;gap:8px}
  header nav a.enllac{font-size:15px;font-weight:600;text-decoration:none;color:var(--gris);padding:8px 10px}
  header nav a.enllac:hover{color:var(--blau)}
  .idiomes{display:flex;gap:4px}
  .idiomes button{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--linia);background:#fff;border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--gris)}
  .idiomes button.actiu{background:var(--blau);border-color:var(--blau);color:#fff}
  .boto{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:11px 20px;text-decoration:none;border:2px solid transparent;cursor:pointer;white-space:nowrap}
  .boto.prim{background:var(--coral);color:#3A2410;box-shadow:0 6px 18px rgba(242,166,90,.35)}
  .boto.prim:hover{filter:brightness(.96)}
  .boto.sec{background:#fff;color:var(--blau);border-color:var(--blau)}
  .boto.sec:hover{background:var(--blau-clar)}
  .boto.petit{font-size:14px;padding:8px 14px}
  /* Portada */
  .hero{background:linear-gradient(180deg,var(--blau-clar),#fff);padding:64px 0 56px}
  .hero .amp{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
  .hero h1{font-size:44px;line-height:1.1;margin:0 0 16px;color:var(--blau);letter-spacing:-.02em}
  .hero h1 em{font-style:normal;color:var(--blau-mig);background:linear-gradient(transparent 62%,rgba(242,166,90,.45) 62%)}
  .hero p.sub{font-size:19px;color:var(--gris);margin:0 0 26px;max-width:560px}
  .hero .crides{display:flex;gap:12px;flex-wrap:wrap}
  .hero .garanties{margin-top:16px;font-size:14px;color:var(--gris);display:flex;gap:16px;flex-wrap:wrap}
  .hero .garanties span::before{content:"✓ ";color:#2E8B57;font-weight:800}
  .mobil{width:280px;margin:0 auto;border:10px solid #22313F;border-radius:38px;background:#fff;box-shadow:0 24px 60px rgba(31,58,95,.25);overflow:hidden}
  .mobil .bar{background:var(--blau);color:#fff;padding:18px 16px 14px}
  .mobil .bar small{opacity:.75;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .mobil .bar b{display:block;font-size:19px;margin-top:2px}
  .mobil .bar span{font-size:12.5px;opacity:.85}
  .mobil .cos{padding:12px;background:var(--fons);display:flex;flex-direction:column;gap:9px}
  .mobil .it{background:#fff;border:1px solid var(--linia);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
  .mobil .it .ic{font-size:18px;line-height:1}
  .mobil .it b{display:block;font-size:13.5px}
  .mobil .it .xip{display:inline-block;margin-top:6px;font-size:11.5px;border:1px solid var(--linia);border-radius:999px;padding:2px 8px;background:var(--fons)}
  .mobil .noti{background:#22313F;color:#fff;border-radius:12px;padding:9px 12px;font-size:12.5px}
  /* Seccions */
  section.blo{padding:72px 0}
  section.blo.gris{background:var(--fons)}
  .titol-sec{text-align:center;max-width:720px;margin:0 auto 40px}
  .titol-sec h2{font-size:32px;line-height:1.2;color:var(--blau);margin:0 0 10px;letter-spacing:-.01em}
  .titol-sec p{color:var(--gris);font-size:17px;margin:0}
  .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .app{background:#fff;border:1px solid var(--linia);border-radius:20px;padding:26px;display:flex;flex-direction:column}
  .app .ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--blau-clar);margin-bottom:14px}
  .app h3{margin:0 0 4px;font-size:22px;color:var(--blau)}
  .app .lema{color:var(--gris);margin:0 0 14px;font-size:15px}
  .app ul{list-style:none;padding:0;margin:0 0 18px;font-size:14.5px;flex:1}
  .app li{padding-left:24px;position:relative;margin-bottom:7px}
  .app li::before{content:"✓";position:absolute;left:0;color:#2E8B57;font-weight:800}
  .app li.ia::before{content:"✨"}
  .app .accions{display:flex;gap:8px;flex-wrap:wrap}
  /* Preus */
  .taula-preus{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .preu{background:#fff;border:1px solid var(--linia);border-radius:20px;padding:24px}
  .preu h3{margin:0 0 14px;font-size:20px;color:var(--blau);display:flex;align-items:center;gap:8px}
  .pla{border-top:1px solid var(--linia);padding:12px 0}
  .pla:first-of-type{border-top:0;padding-top:0}
  .pla .nom{font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .pla .imp{font-size:26px;font-weight:800;color:var(--blau);white-space:nowrap}
  .pla .imp small{font-size:13px;font-weight:600;color:var(--gris)}
  .pla .det{font-size:13.5px;color:var(--gris);margin-top:2px}
  .pla.prem .nom span.et{background:var(--coral-clar);color:#8A4B12;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px}
  .pack{margin-top:26px;background:var(--blau);color:#fff;border-radius:24px;padding:30px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:20px;align-items:center}
  .pack h3{margin:0 0 6px;font-size:24px}
  .pack p{margin:0;opacity:.85;font-size:15px}
  .pack .opc{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:16px}
  .pack .opc .nom{font-weight:700;font-size:15px}
  .pack .opc .imp{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px}
  .pack .opc .imp small{font-size:13px;font-weight:600;opacity:.8}
  .pack .opc .abans{font-size:13px;opacity:.75}
  .pack .opc .abans s{opacity:.9}
  .pack .badge{display:inline-block;background:var(--coral);color:#3A2410;font-weight:800;font-size:13px;border-radius:999px;padding:4px 10px;margin-bottom:10px}
  .nota-preus{text-align:center;color:var(--gris);font-size:14px;margin-top:18px}
  /* Passos */
  .passos{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:p}
  .pas{background:#fff;border:1px solid var(--linia);border-radius:20px;padding:24px;position:relative}
  .pas::before{counter-increment:p;content:counter(p);display:flex;width:36px;height:36px;border-radius:50%;background:var(--coral);color:#3A2410;font-weight:800;align-items:center;justify-content:center;margin-bottom:12px}
  .pas h3{margin:0 0 6px;color:var(--blau);font-size:18px}
  .pas p{margin:0;color:var(--gris);font-size:15px}
  /* Preguntes */
  .faq{max-width:760px;margin:0 auto}
  .faq details{background:#fff;border:1px solid var(--linia);border-radius:14px;padding:16px 18px;margin-bottom:10px}
  .faq summary{font-weight:700;cursor:pointer;color:var(--blau);list-style:none;display:flex;justify-content:space-between;gap:10px}
  .faq summary::after{content:"+";font-size:20px;line-height:1;color:var(--gris)}
  .faq details[open] summary::after{content:"–"}
  .faq details p{margin:10px 0 0;color:var(--gris);font-size:15px}
  /* Final */
  .final{text-align:center;padding:72px 0;background:linear-gradient(180deg,#fff,var(--blau-clar))}
  .final h2{font-size:32px;color:var(--blau);margin:0 0 10px}
  .final p{color:var(--gris);margin:0 0 24px;font-size:17px}
  footer{background:#22313F;color:rgba(255,255,255,.8);font-size:14px;padding:28px 0}
  footer .amp{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer a{color:#fff}
  @media (max-width:900px){
    .hero .amp{grid-template-columns:1fr}
    .hero h1{font-size:34px}
    .apps,.taula-preus,.passos{grid-template-columns:1fr}
    .pack{grid-template-columns:1fr}
    header nav a.enllac.amaga{display:none}
  }
  @media (max-width:420px){
    header nav a.enllac.amaga{display:none}
    .hero{padding:40px 0}
    .hero h1{font-size:30px}
    section.blo{padding:52px 0}
    .titol-sec h2{font-size:26px}
  }
</style>
</head>

      a2f: ["Itineraris dia a dia amb fotos", "Serveis opcionals que el client tria", "Total i preu per persona al moment", "PDF per enviar o imprimir", "Quan el client accepta, es converteix en un viatge d'Anonta"],
      a2ia: ["IA per redactar els dies i els serveis"],
      a3: "Formulari de viatgers", a3l: "Les dades dels viatgers, sense empaitar ningú",
      a3f: ["Un enllaç per WhatsApp i el client l'omple des del mòbil", "Dades de tots els viatgers, amb foto del DNI i del passaport", "Avís si el passaport caduca abans d'hora", "Et arriba un correu quan l'envien", "Amb un clic, les dades passen a Anonta"],
      a3ia: [],
      preusTitol: "Preus clars, sense sorpreses", preusSub: "Preus mensuals per agència, amb IVA inclòs. Els 30 primers dies són gratis i amb tot el pla Prèmium.",
      basic: "Bàsic", premium: "Prèmium", unic: "Tarifa única", mes: "/mes",
      dA_b: "App amb el logo d'Anonta. Sense IA.", dA_p: "El teu logo i els teus colors a l'app del client, i IA.",
      dI_b: "Itineraris il·limitats, opcionals i PDF.", dI_p: "Tot el del Bàsic i IA per redactar.",
      dF: "Formularis il·limitats per a tots els teus viatges.", recomanat: "Recomanat",
      packTitol: "Les 3 apps juntes", packTxt: `Si contractes Anonta, Itineraris i el Formulari de viatgers, tens un ${D} % de descompte sobre el total, cada mes.`,
      packB: "Pack Bàsic", packP: "Pack Prèmium", enLloc: "en lloc de",
      notaPreus: "Tots els preus porten l'IVA inclòs. Sense permanència: et pots donar de baixa quan vulguis. Dubtes? Escriu-nos a admin@rimuviatges.com.",
      passosTitol: "Començar és molt fàcil",
      p1: "Demana la teva prova", p1t: "Posa el nom de la teva agència, el teu correu i, si vols, el teu logo. Res més.",
      p2: "Prova-ho 30 dies", p2t: "Amb els teus viatges i els teus clients de veritat, i amb tot el pla Prèmium.",
      p3: "Tria el teu pla", p3t: "Si t'agrada, tries Bàsic o Prèmium. I si hi afegeixes les altres apps, el descompte del pack.",
      faqTitol: "Preguntes freqüents",
      faq: [
        ["Els meus clients han de descarregar alguna cosa d'una botiga d'apps?", "No. Els envies un enllaç, entren amb el seu correu i, si volen, l'afegeixen a la pantalla d'inici del mòbil com una app més. Funciona a iPhone i Android."],
        ["Hi puc posar el logo de la meva agència?", "Sí, amb el pla Prèmium l'app del client porta el teu logo i els teus colors. Amb el Bàsic, porta el logo d'Anonta."],
        ["Què passa quan s'acaba la prova?", "Res automàtic: no et demanem targeta. Si vols continuar, tries pla i seguim. Si no, no pagues res."],
        ["Puc començar amb una sola app?", "És clar. Pots començar amb la que necessitis i afegir-hi les altres des del teu panell, a «Les meves apps»."],
        ["Les meves dades i les dels meus clients estan segures?", "Cada agència només veu els seus viatges i cada client només veu els seus. Els documents s'obren amb enllaços temporals i privats."]
      ],
      finalTitol: "Ho provem amb el teu pròxim viatge?", finalSub: "30 dies gratis, sense targeta i sense compromís.",
      peu: "Anonta és un projecte de <b>Rimu Viatges</b>, agència de viatges de Ripoll."
    }
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function pinta(){
    const t = T[LANG];
    document.documentElement.lang = LANG;
    document.querySelectorAll(".idiomes button").forEach(b => b.classList.toggle("actiu", b.dataset.l === LANG));
    document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if(typeof v === "string"){ if(el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v; } });

    const apps = [
      { ico: "📱", n: t.a1, l: t.a1l, f: t.a1f, ia: t.a1ia, demo: "anonta/demo.html?web", prova: "anonta/demo.html?web#prova" },
      { ico: "🗺️", n: t.a2, l: t.a2l, f: t.a2f, ia: t.a2ia, demo: "itineraris/admin.html?demo&web", prova: "itineraris/admin.html?demo&prova&web" },
      { ico: "📝", n: t.a3, l: t.a3l, f: t.a3f, ia: t.a3ia, demo: "demo.html?web", prova: "demo.html?web" }
    ];
    document.getElementById("llistaApps").innerHTML = apps.map(a => `
      <div class="app"><div class="ico">${a.ico}</div><h3>${esc(a.n)}</h3><p class="lema">${esc(a.l)}</p>
        <ul>${a.f.map(x => `<li>${esc(x)}</li>`).join("")}${a.ia.map(x => `<li class="ia">${esc(x)} <small>(${esc(t.premium)})</small></li>`).join("")}</ul>
        <div class="accions"><a class="boto sec petit" href="${a.demo}">👀 ${esc(t.ver)}</a><a class="boto prim petit" href="${a.prova}">${esc(t.provar)}</a></div></div>`).join("");

    const pla = (nom, imp, det, prem) => `<div class="pla${prem ? " prem" : ""}"><div class="nom"><span>${esc(nom)}${prem ? `<span class="et">${esc(t.recomanat)}</span>` : ""}</span>
      <span class="imp">${eur(imp)}<small>${t.mes}</small></span></div><div class="det">${esc(det)}</div></div>`;
    document.getElementById("taulaPreus").innerHTML = `
      <div class="preu"><h3>📱 ${esc(t.a1)}</h3>${pla(t.basic, W.anonta.basic, t.dA_b)}${pla(t.premium, W.anonta.premium, t.dA_p, true)}</div>
      <div class="preu"><h3>🗺️ ${esc(t.a2)}</h3>${pla(t.basic, W.itineraris.basic, t.dI_b)}${pla(t.premium, W.itineraris.premium, t.dI_p, true)}</div>
      <div class="preu"><h3>📝 ${esc(t.a3)}</h3>${pla(t.unic, W.formularis, t.dF)}</div>`;
    document.getElementById("pack").innerHTML = `
      <div><span class="badge">−${D} %</span><h3>${esc(t.packTitol)}</h3><p>${esc(t.packTxt)}</p></div>
      <div class="opc"><div class="nom">${esc(t.packB)}</div><div class="imp">${eur(packB)}<small>${t.mes}</small></div><div class="abans">${esc(t.enLloc)} <s>${eur(sumaB)}</s></div></div>
      <div class="opc"><div class="nom">${esc(t.packP)}</div><div class="imp">${eur(packP)}<small>${t.mes}</small></div><div class="abans">${esc(t.enLloc)} <s>${eur(sumaP)}</s></div></div>`;
    document.getElementById("faq").innerHTML = t.faq.map(([q, r]) => `<details><summary>${esc(q)}</summary><p>${esc(r)}</p></details>`).join("");
    document.title = LANG === "ca" ? "Anonta · Apps per a agències de viatges" : "Anonta · Apps para agencias de viajes";
  }
  document.querySelectorAll(".idiomes button").forEach(b => b.onclick = () => { LANG = b.dataset.l; try{ localStorage.setItem("anonta_web_idioma", LANG); }catch(e){} pinta(); });
  pinta();
})();
</script>
