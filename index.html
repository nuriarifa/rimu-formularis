<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rimu Viatges · Dades del viatge</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="estil.css">
<script src="config.js"></script>
<script src="logo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="cap">
  <img class="logo" alt="Rimu Viatges">
</header>

<main class="contingut">
  <div id="carregant" class="targeta centre">…</div>
  <div id="error" class="targeta centre amagat"></div>

  <form id="form" class="amagat" novalidate>
    <div class="targeta">
      <div class="viatge-titol" id="titol"></div>
      <div class="viatge-dates" id="dates"></div>
      <div class="ratlla"></div>
      <p id="intro" style="margin:0"></p>
      <div id="jaEnviat" class="avis amagat"></div>
    </div>

    <div id="viatgers"></div>

    <div class="targeta">
      <label class="consentiment">
        <input type="checkbox" id="consent">
        <span id="txtConsent"></span>
      </label>
      <div id="errForm" class="error amagat"></div>
      <div style="margin-top:16px"><button class="boto ample" id="btnEnviar" type="submit"></button></div>
    </div>
  </form>

  <div id="gracies" class="targeta centre amagat">
    <div style="font-size:44px">✈️</div>
    <h2 style="justify-content:center" id="txtGracies"></h2>
    <p id="txtGracies2"></p>
  </div>

  <div class="peu">Rimu Viatges · <span id="lema"></span></div>
</main>

<script>
const T = {
  ca: {
    carregant: "Carregant…",
    noTrobat: "No hem trobat aquest formulari. Revisa l'enllaç o contacta amb Rimu Viatges.",
    errConn: "No s'ha pogut carregar el formulari. Torna-ho a provar d'aquí a una estona.",
    intro1: "Per preparar el teu viatge necessitem algunes dades. Algunes ja les tenim i les veuràs omplertes: revisa que siguin correctes i completa la resta.",
    introN: "Per preparar el viatge necessitem les dades de tots els viatgers. Les que ja tenim les veureu omplertes: reviseu que siguin correctes i completeu la resta.",
    jaEnviat: "Ja hem rebut aquestes dades. Si cal corregir alguna cosa, modifica-la i torna a enviar.",
    viatger: "Viatger/a",
    personals: "Dades personals", document: "Documentació", adreca: "Adreça", contacte: "Contacte",
    nom: "Nom", cognoms: "Cognoms", nomAjuda: "Exactament com apareix al passaport",
    naixement: "Data de naixement", dni: "Número de DNI",
    passaport: "Número de passaport", caducitat: "Data de caducitat del passaport",
    carrer: "Carrer, número i pis", poblacio: "Població", cp: "Codi postal", provincia: "Província",
    telefon: "Telèfon", email: "Correu electrònic",
    avisPass: "Atenció: el passaport ha de tenir com a mínim 6 mesos de validesa a partir de la data del viatge. Si caduca abans, caldrà renovar-lo.",
    consent: "Accepto que Rimu Viatges utilitzi aquestes dades únicament per gestionar la reserva i la documentació d'aquest viatge.",
    enviar: "Enviar les dades", enviant: "Enviant…",
    falten: "Falten alguns camps obligatoris (marcats en vermell).",
    faltaConsent: "Cal acceptar el tractament de les dades per poder enviar.",
    errEnviar: "No s'han pogut enviar les dades. Comprova la connexió i torna-ho a provar.",
    gracies: "Moltes gràcies!", gracies2: "Hem rebut les dades correctament. Ens posarem en contacte amb tu si cal res més.",
    lema: "El teu pròxim destí comença aquí",
    del: "del", al: "al",
    mesos: ["de gener","de febrer","de març","d'abril","de maig","de juny","de juliol","d'agost","de setembre","d'octubre","de novembre","de desembre"]
  },
  es: {
    carregant: "Cargando…",
    noTrobat: "No hemos encontrado este formulario. Revisa el enlace o contacta con Rimu Viatges.",
    errConn: "No se ha podido cargar el formulario. Vuelve a intentarlo en un rato.",
    intro1: "Para preparar tu viaje necesitamos algunos datos. Algunos ya los tenemos y los verás rellenados: revisa que sean correctos y completa el resto.",
    introN: "Para preparar el viaje necesitamos los datos de todos los viajeros. Los que ya tenemos los veréis rellenados: revisad que sean correctos y completad el resto.",
    jaEnviat: "Ya hemos recibido estos datos. Si hay que corregir algo, modifícalo y vuelve a enviar.",
    viatger: "Viajero/a",
    personals: "Datos personales", document: "Documentación", adreca: "Dirección", contacte: "Contacto",
    nom: "Nombre", cognoms: "Apellidos", nomAjuda: "Exactamente como aparece en el pasaporte",
    naixement: "Fecha de nacimiento", dni: "Número de DNI",
    passaport: "Número de pasaporte", caducitat: "Fecha de caducidad del pasaporte",
    carrer: "Calle, número y piso", poblacio: "Población", cp: "Código postal", provincia: "Provincia",
    telefon: "Teléfono", email: "Correo electrónico",
    avisPass: "Atención: el pasaporte debe tener como mínimo 6 meses de validez a partir de la fecha del viaje. Si caduca antes, habrá que renovarlo.",
    consent: "Acepto que Rimu Viatges utilice estos datos únicamente para gestionar la reserva y la documentación de este viaje.",
    enviar: "Enviar los datos", enviant: "Enviando…",
    falten: "Faltan algunos campos obligatorios (marcados en rojo).",
    faltaConsent: "Hay que aceptar el tratamiento de los datos para poder enviar.",
    errEnviar: "No se han podido enviar los datos. Comprueba la conexión y vuelve a intentarlo.",
    gracies: "¡Muchas gracias!", gracies2: "Hemos recibido los datos correctamente. Nos pondremos en contacto contigo si hace falta algo más.",
    lema: "Tu próximo destino empieza aquí",
    del: "del", al: "al",
    mesos: ["de enero","de febrero","de marzo","de abril","de mayo","de junio","de julio","de agosto","de septiembre","de octubre","de noviembre","de diciembre"]
  }
};

// Camps: [clau, tipus, obligatori, ample]
const SECCIONS = [
  ["personals", [["nom","text",1],["cognoms","text",1],["naixement","date",1],["dni","text",1]]],
  ["document",  [["passaport","text",1],["caducitat","date",1]]],
  ["adreca",    [["carrer","text",1,1],["poblacio","text",1],["cp","text",1],["provincia","text",1]]],
  ["contacte",  [["telefon","tel",1],["email","email",1]]]
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let L = T.ca, F = null;
const sb = supabase.createClient(RIMU.SUPABASE_URL, RIMU.SUPABASE_KEY);

function dataLlarga(iso){
  if(!iso) return "";
  const [a,m,d] = iso.split("-").map(Number);
  return d + " " + L.mesos[m-1] + " " + a;
}

function pintar(){
  document.documentElement.lang = F.idioma;
  $("lema").textContent = L.lema;
  $("titol").textContent = F.titol;
  let d = "";
  if(F.data_inici && F.data_fi) d = "Del " + dataLlarga(F.data_inici) + " " + L.al + " " + dataLlarga(F.data_fi);
  else if(F.data_inici) d = dataLlarga(F.data_inici);
  $("dates").textContent = d;
  $("intro").textContent = F.viatgers.length > 1 ? L.introN : L.intro1;
  if(F.estat === "rebut"){ $("jaEnviat").textContent = L.jaEnviat; $("jaEnviat").classList.remove("amagat"); }
  $("txtConsent").textContent = L.consent;
  $("btnEnviar").textContent = L.enviar;
  $("txtGracies").textContent = L.gracies;
  $("txtGracies2").textContent = L.gracies2;

  let html = "";
  F.viatgers.forEach((v, i) => {
    html += `<div class="targeta"><h2><span class="num">${i+1}</span>${esc(L.viatger)}${F.viatgers.length>1?" "+(i+1):""}</h2>`;
    SECCIONS.forEach(([sec, camps]) => {
      html += `<h3>${esc(L[sec])}</h3><div class="graella">`;
      camps.forEach(([k, tipus, obl, ample]) => {
        const val = v[k] || "";
        const id = `v${i}_${k}`;
        const ajuda = (k==="nom"||k==="cognoms") ? `<div class="ajuda">${esc(L.nomAjuda)}</div>` : "";
        html += `<div class="${ample?"ample":""}"><label for="${id}">${esc(L[k])}</label>
          <input id="${id}" data-i="${i}" data-k="${k}" type="${tipus}" value="${esc(val)}"
            ${obl?"required":""} class="${val?"prefill":""}"
            ${k==="email"?'autocomplete="email" inputmode="email"':""}
            ${k==="telefon"?'autocomplete="tel" inputmode="tel"':""}
            ${k==="cp"?'inputmode="numeric" autocomplete="postal-code"':""}>${ajuda}</div>`;
      });
      html += `</div>`;
      if(sec==="document") html += `<div id="avisPass${i}" class="avis amagat">${esc(L.avisPass)}</div>`;
    });
    html += `</div>`;
  });
  $("viatgers").innerHTML = html;
  F.viatgers.forEach((_, i) => {
    const c = $(`v${i}_caducitat`);
    c.addEventListener("change", () => comprovaPassaport(i));
    comprovaPassaport(i);
  });
  document.querySelectorAll("#viatgers input").forEach(inp =>
    inp.addEventListener("input", () => { inp.style.borderColor = ""; }));
}

function comprovaPassaport(i){
  const cad = $(`v${i}_caducitat`).value;
  const ref = F.data_fi || F.data_inici;
  let malament = false;
  if(cad && ref){
    const r = new Date(ref + "T00:00:00"); r.setMonth(r.getMonth() + 6);
    malament = new Date(cad + "T00:00:00") < r;
  }
  $(`avisPass${i}`).classList.toggle("amagat", !malament);
}

async function carregar(){
  const id = new URLSearchParams(location.search).get("f");
  if(!id){ mostrarError(T.ca.noTrobat); return; }
  try{
    const { data, error } = await sb.rpc("obtenir_formulari", { p_id: id });
    if(error){ mostrarError(/uuid/i.test(error.message) ? T.ca.noTrobat : T.ca.errConn); return; }
    if(!data){ mostrarError(T.ca.noTrobat); return; }
    F = data; L = T[F.idioma] || T.ca;
    pintar();
    $("carregant").classList.add("amagat");
    $("form").classList.remove("amagat");
  }catch(e){ mostrarError(T.ca.errConn); }
}
function mostrarError(t){
  $("carregant").classList.add("amagat");
  $("error").textContent = t; $("error").classList.remove("amagat");
}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("errForm"); err.classList.add("amagat");
  let primer = null;
  document.querySelectorAll("#viatgers input").forEach(inp => {
    const buit = inp.required && !inp.value.trim();
    const malEmail = inp.type==="email" && inp.value && !inp.checkValidity();
    inp.style.borderColor = (buit || malEmail) ? "#B3261E" : "";
    if((buit || malEmail) && !primer) primer = inp;
  });
  if(primer){ err.textContent = L.falten; err.classList.remove("amagat"); primer.focus(); return; }
  if(!$("consent").checked){ err.textContent = L.faltaConsent; err.classList.remove("amagat"); return; }

  const viatgers = F.viatgers.map((v, i) => {
    const o = {};
    SECCIONS.forEach(([, camps]) => camps.forEach(([k]) => { o[k] = $(`v${i}_${k}`).value.trim(); }));
    return o;
  });

  const b = $("btnEnviar"); b.disabled = true; b.textContent = L.enviant;
  try{
    const { data, error } = await sb.rpc("enviar_formulari", { p_id: F.id, p_viatgers: viatgers });
    if(error || data !== true) throw error || new Error("no");
    avisarPerCorreu(viatgers);
    $("form").classList.add("amagat");
    $("gracies").classList.remove("amagat");
    window.scrollTo(0, 0);
  }catch(e){
    err.textContent = L.errEnviar; err.classList.remove("amagat");
    b.disabled = false; b.textContent = L.enviar;
  }
});

// Avís per correu a l'agència (sense dades personals sensibles)
function avisarPerCorreu(viatgers){
  if(!RIMU.EMAIL_AVIS) return;
  const noms = viatgers.map(v => (v.nom + " " + v.cognoms).trim()).join(", ");
  const panell = location.href.replace(/index\.html.*$/, "").replace(/\?.*$/, "").replace(/\/?$/, "/") + "admin.html";
  fetch("https://formsubmit.co/ajax/" + RIMU.EMAIL_AVIS, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      _subject: "Nou formulari rebut: " + F.titol + " – " + noms,
      _template: "table", _captcha: "false",
      "Viatge": F.titol,
      "Viatgers": noms,
      "Consulta-ho al panell": panell
    })
  }).catch(() => {});
}

$("carregant").textContent = T.ca.carregant;
carregar();
</script>
</body>
</html>
